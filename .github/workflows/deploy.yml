name: deploy

# Пуш в main заливает содержимое site/ на сервер.
# Secrets: SSH_HOST, SSH_USER, SSH_KEY (приватный ключ), TARGET_PATH (напр. /srv/juno-trading-party/site)

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, что словари RU и KZ совпадают
        run: |
          cd site
          node -e "
            global.window = {};
            require('./assets/js/copy.js');
            const C = window.COPY;
            const ru = Object.keys(C.ru), kz = Object.keys(C.kz);
            const diff = ru.filter(k => !(k in C.kz)).concat(kz.filter(k => !(k in C.ru)));
            const empty = [];
            for (const l of ['ru','kz'])
              for (const [k,v] of Object.entries(C[l]))
                if (!String(v).trim()) empty.push(l + '/' + k);
            if (diff.length) { console.error('Ключи расходятся:', diff); process.exit(1); }
            if (empty.length) { console.error('Пустые значения:', empty); process.exit(1); }
            console.log('Словари в порядке:', ru.length, 'ключей');
          "

      - name: Проверить, что все data-i18n находят перевод
        run: |
          cd site
          node -e "
            global.window = {};
            require('./assets/js/copy.js');
            const fs = require('fs');
            let bad = [];
            for (const f of ['index.html','terms.html']) {
              const html = fs.readFileSync(f, 'utf8');
              for (const m of html.matchAll(/data-i18n=\"([^\"]+)\"/g))
                if (!(m[1] in window.COPY.ru)) bad.push(f + ' → ' + m[1]);
            }
            if (bad.length) { console.error('Нет перевода:', bad); process.exit(1); }
            console.log('Все ключи разрешаются');
          "

      - name: Настроить SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Залить site/ на сервер
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519" \
            site/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.TARGET_PATH }}/"
