name: check

# Cloudflare Pages деплоит сам из git. Здесь только проверки,
# чтобы сломанный перевод не уехал в прод.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Словари RU и KZ совпадают и не пустые
        run: |
          cd site
          node -e "
            global.window = {};
            require('./assets/js/copy.js');
            const C = window.COPY;
            const ru = Object.keys(C.ru), kz = Object.keys(C.kz);
            const diff = ru.filter(k => !(k in C.kz)).concat(kz.filter(k => !(k in C.ru)));
            const empty = [];
            for (const l of ['ru','kz'])
              for (const [k,v] of Object.entries(C[l]))
                if (!String(v).trim()) empty.push(l + '/' + k);
            if (diff.length) { console.error('Ключи расходятся:', diff); process.exit(1); }
            if (empty.length) { console.error('Пустые значения:', empty); process.exit(1); }
            console.log('Словари в порядке:', ru.length, 'ключей');
          "

      - name: Все data-i18n находят перевод
        run: |
          cd site
          node -e "
            global.window = {};
            require('./assets/js/copy.js');
            const fs = require('fs');
            const bad = [];
            for (const f of ['index.html','terms.html']) {
              const html = fs.readFileSync(f, 'utf8');
              for (const m of html.matchAll(/data-i18n=\"([^\"]+)\"/g))
                if (!(m[1] in window.COPY.ru)) bad.push(f + ' → ' + m[1]);
            }
            if (bad.length) { console.error('Нет перевода:', bad); process.exit(1); }
            console.log('Все ключи разрешаются');
          "
